<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Change Password — Al Noor Clinic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar no-print">
  <h1>Change Password</h1>
  <div><span class="who" data-who></span> &nbsp; <button onclick="logout()">Log out</button></div>
</div>
<div class="wrap" style="max-width:400px;">
  <div class="card">
    <form id="pwForm">
      <label>Current password</label><input type="password" id="oldPw" required>
      <label>New password (min. 6 characters)</label><input type="password" id="newPw" required minlength="6">
      <label>Confirm new password</label><input type="password" id="newPw2" required minlength="6">
      <button class="primary" type="submit">Update Password</button>
      <div id="msg"></div>
    </form>
    <p class="muted" style="margin-top:14px;"><a href="javascript:history.back()">← Back</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
requireRole(null);
document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = '';
  const newPw = document.getElementById('newPw').value;
  const newPw2 = document.getElementById('newPw2').value;
  if (newPw !== newPw2) { msg.className = 'error'; msg.textContent = 'New passwords do not match.'; return; }
  try {
    await api('/api/me/password', { method: 'POST', body: JSON.stringify({
      old_password: document.getElementById('oldPw').value, new_password: newPw
    })});
    msg.className = 'success'; msg.textContent = 'Password updated.';
    document.getElementById('pwForm').reset();
  } catch (ex) { msg.className = 'error'; msg.textContent = ex.message; }
});
</script>
</body>
</html>
